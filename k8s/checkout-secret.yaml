# DEMO ONLY. A real Service Credential belongs in a real secret manager
# (your cloud provider's, Vault, External Secrets Operator, etc.) synced
# into a Kubernetes Secret — never committed to git as a plain Opaque
# Secret the way this file is. This one exists only so the example runs
# with `kubectl apply -k k8s/` and no external setup; the value below is
# meaningless (mock-rollfuse-api never checks it).
apiVersion: v1
kind: Secret
metadata:
  name: rollfuse-credential
  namespace: rollfuse-example
type: Opaque
stringData:
  ROLLFUSE_SERVICE_CREDENTIAL: demo-credential
